<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIANÉ Channel</title>
<meta name="description" content="VIANÉ Channel — Shop, Social & Lifestyle">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center;
  font-family:Arial,Helvetica,sans-serif; color:#241f21;
  background:linear-gradient(145deg,#f7f0ed,#eee5e1 55%,#f8f5f3);
}
.wrap{width:100%;max-width:520px;padding:55px 22px 35px;text-align:center}
.avatar{
  width:86px;height:86px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(135deg,#30272a,#8e777b);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:28px;font-weight:700;letter-spacing:2px;
  box-shadow:0 10px 30px #0002;
}
h1{margin:0;font-family:Georgia,serif;font-size:31px;letter-spacing:.5px}
.sub{margin:9px 0 30px;color:#76686b;font-size:14px;letter-spacing:1.5px}
.links{display:flex;flex-direction:column;gap:14px}
a{
  text-decoration:none;color:#211c1e;background:#fffdfc;
  border:1px solid #e6dcda;border-radius:17px;padding:18px 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 7px 22px #3b2b3012;
  transition:.2s;
}
a:hover{transform:translateY(-2px);box-shadow:0 10px 26px #3b2b3022}
.icon{font-size:23px;width:32px}
.txt{text-align:left;flex:1}
.title{font-weight:700;font-size:16px}
.desc{font-size:12px;color:#8a7d80;margin-top:4px}
.arrow{font-size:20px;color:#9b898e}
footer{margin-top:34px;color:#9a8c8f;font-size:11px;letter-spacing:1px}
</style>
</head>
<body>
<main class="wrap">
  <div class="avatar">V</div>

        <span class="desc">Shop my TikTok showcase</span>
      </span><span class="arrow">›</span>

        <span class="desc">Social & lifestyle</span>
